        function detectLanguage() {
            // 1. URL 파라미터 체크
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && translations[urlLang]) {
                return urlLang;
            }

            // 2. localStorage 체크 (이전 선택 기억)
            const savedLang = localStorage.getItem('colorTestLang');
            if (savedLang && translations[savedLang]) {
                return savedLang;
            }

            // 3. 브라우저 언어 감지
            const browserLangs = navigator.languages || [navigator.language || navigator.userLanguage];
            
            for (const lang of browserLangs) {
                // 정확한 매칭 (zh-TW, zh-CN 등)
                if (translations[lang]) {
                    return lang;
                }
                
                // 언어 코드만 추출 (en-US -> en)
                const shortLang = lang.split('-')[0].toLowerCase();
                
                // 중국어 특수 처리
                if (lang.toLowerCase().includes('zh')) {
                    if (lang.includes('TW') || lang.includes('HK') || lang.includes('Hant')) {
                        return 'zh-TW';
                    }
                    return 'zh';
                }
                
                if (translations[shortLang]) {
                    return shortLang;
                }
            }

            // 4. 기본값: 영어
            return 'en';
        }

        // 현재 언어 설정
        let currentLang = detectLanguage();
        localStorage.setItem('colorTestLang', currentLang);

        // 번역 가져오기 함수
        function t(key) {
            return translations[currentLang]?.[key] || translations['en'][key] || key;
        }

        // 등급 가져오기 함수
        function getGrades() {
            return translations[currentLang]?.grades || translations['en'].grades;
        }

        const levelDisplay = document.getElementById('levelDisplay');
        const startScreen = document.getElementById('startScreen');
        const resultOverlay = document.getElementById('resultOverlay');
        const bestScoreDisplay = document.getElementById('bestScoreDisplay');

        // 다국어 적용 함수
        function applyTranslations() {
            // 일반 텍스트 번역
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            
            // HTML 포함 번역
            document.querySelectorAll('[data-i18n-html]').forEach(el => {
                const key = el.getAttribute('data-i18n-html');
                el.innerHTML = t(key);
            });

            // 페이지 타이틀 업데이트
            document.title = `${t('title')} | WitLab`;
            
            // HTML lang 속성 업데이트
            document.documentElement.lang = currentLang;
        }

        // 초기화
        applyTranslations();
        bestScoreDisplay.textContent = bestScore;

        // Difficulty Settings
        function getDifficulty(level) {
            if (level <= 2) return { gridSize: 2, opacityDiff: 0.5 };
            if (level <= 4) return { gridSize: 3, opacityDiff: 0.7 };
            if (level <= 8) return { gridSize: 4, opacityDiff: 0.8 };
            if (level <= 12) return { gridSize: 5, opacityDiff: 0.9 };
            if (level <= 16) return { gridSize: 6, opacityDiff: 0.93 };
            if (level <= 20) return { gridSize: 6, opacityDiff: 0.95 };
            return { gridSize: 6, opacityDiff: Math.min(0.98, 0.95 + (level - 20) * 0.005) };
        }

        // Generate Random Color
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            const saturation = 60 + Math.floor(Math.random() * 30);
            const lightness = 45 + Math.floor(Math.random() * 20);
            return { h: hue, s: saturation, l: lightness };
        }

        // Create Board
        function createBoard() {
            const { gridSize, opacityDiff } = getDifficulty(level);
            const totalTiles = gridSize * gridSize;
            const color = getRandomColor();
            
            correctTileIndex = Math.floor(Math.random() * totalTiles);
            
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = '';
            
            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                
                if (i === correctTileIndex) {
                    // Different tile (정답)
                    tile.style.background = `hsl(${color.h}, ${color.s}%, ${color.l}%)`;
                } else {
                    // Normal tiles
                    tile.style.background = `hsla(${color.h}, ${color.s}%, ${color.l}%, ${opacityDiff})`;
                }
                
                tile.dataset.index = i;
                tile.addEventListener('click', handleTileClick);
                board.appendChild(tile);
            }
        }

        // Handle Tile Click
        function handleTileClick(e) {
            if (!isPlaying) return;
            
            const clickedIndex = parseInt(e.target.dataset.index);
            
            if (clickedIndex === correctTileIndex) {
                // Correct!
                e.target.classList.add('correct');
                level++;
                levelDisplay.textContent = level;
                
                setTimeout(() => {
                    createBoard();
                }, 200);
            } else {
                // Wrong!
                e.target.classList.add('wrong');
                board.classList.add('shake');
                timeLeft = Math.max(0, timeLeft - 3);
                updateTimerDisplay();
                
                setTimeout(() => {
                    board.classList.remove('shake');
                }, 400);
            }
        }

        // Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerDisplay();
                
                if (timeLeft <= 5) {
                    timerDisplay.classList.add('warning');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 100);
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = Math.max(0, timeLeft).toFixed(1);
        }

        // Start Game
        function startGame() {
            startScreen.classList.add('hidden');
            level = 1;
            timeLeft = 15.0;
            isPlaying = true;
            
            levelDisplay.textContent = level;
            timerDisplay.classList.remove('warning');
            updateTimerDisplay();
            
            createBoard();
            startTimer();
        }

        // End Game
        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            
            const score = level - 1;
            const isNewRecord = score > bestScore;
            
            if (isNewRecord) {
                bestScore = score;
                localStorage.setItem('colorTestBest', bestScore);
                bestScoreDisplay.textContent = bestScore;
            }
            
            showResult(score, isNewRecord);
        }

        // Show Result
        function showResult(score, isNewRecord) {
            const grades = getGrades();
            
            let result = grades[0];
            for (const g of grades) {
                if (score >= g.min) result = g;
            }
            
            document.getElementById('resultEmoji').textContent = result.emoji;
            document.getElementById('resultGrade').textContent = result.grade;
            document.getElementById('resultDesc').textContent = result.desc;
            document.getElementById('finalScoreValue').textContent = score;
            
            const bestScoreEl = document.getElementById('bestScoreValue');
            bestScoreEl.textContent = bestScore;
            
            if (isNewRecord) {
                bestScoreEl.classList.add('new-record');
            } else {
                bestScoreEl.classList.remove('new-record');
            }
            
            resultOverlay.classList.add('show');
        }

        // Restart Game
        function restartGame() {
            resultOverlay.classList.remove('show');
            
            setTimeout(() => {
                startGame();
            }, 300);
        }

        // Share Functions
        function shareKakao() {
            const score = level - 1;
            const text = t('shareText').replace('{score}', score);
            
            // Kakao SDK가 없으면 일반 공유
            if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
                Kakao.Share.sendDefault({
                    objectType: 'text',
                    text: text,
                    link: {
                        mobileWebUrl: window.location.href,
                        webUrl: window.location.href
                    }
                });
            } else {
                // 웹 공유 API 사용 시도
                if (navigator.share) {
                    navigator.share({
                        title: t('title'),
                        text: text,
                        url: window.location.href
                    }).catch(() => {
                        // 공유 취소시 무시
                    });
                } else {
                    // 카카오톡 스토리로 대체
                    const url = `https://story.kakao.com/share?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
                    window.open(url, '_blank');
                }
            }
        }

        function copyLink() {
            const score = level - 1;
            const text = t('copyText').replace('{score}', score).replace('{url}', window.location.href);
            
            navigator.clipboard.writeText(text).then(() => {
                showToast(t('linkCopied'));
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(t('linkCopied'));
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Prevent zoom on double tap (mobile)
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.target.click();
        }, { passive: false });
    </script>
</body>
</html>
